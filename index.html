<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101D35" />
    <meta
      name="description"
      content="Rota+ — organize oportunidades, planeje visitas e conquiste novos clientes."
    />
    <title>Rota+ | Seu próximo cliente começa aqui</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232864DC'/%3E%3Ctext x='10' y='46' font-size='43' fill='white' font-family='sans-serif' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // When GitHub Pages publishes the repository root, send visitors to the
      // production build. This does not affect the local Vite development URL.
      if (location.hostname.endsWith(".github.io")) {
        const repositoryPath = location.pathname.endsWith("/")
          ? location.pathname
          : `${location.pathname}/`;
        location.replace(`${repositoryPath}dist/${location.hash}`);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
