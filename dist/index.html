  <body>
    <div id="root"></div>
    <script>
      // When GitHub Pages publishes the repository root, send visitors to the
      // production build. This does not affect the local Vite development URL.
      if (
        location.hostname.endsWith(".github.io") &&
        !location.pathname.includes("/dist/")
      ) {
        const repositoryPath = location.pathname.endsWith("/")
          ? location.pathname
          : `${location.pathname}/`;
        location.replace(`${repositoryPath}dist/${location.hash}`);
      }
    </script>
